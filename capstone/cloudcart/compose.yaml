name: cloudcart

x-app: &app
  build:
    context: .
  image: cloudcart-app:0.1.0
  environment: &app-environment
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_NAME: cloudcart
    DATABASE_USER: cloudcart
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    AMQP_HOST: broker
    AMQP_PORT: "5672"
    AMQP_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
    AMQP_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  migrate:
    <<: *app
    entrypoint: ["python", "-m", "cloudcart.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.50

  outbox-relay:
    <<: *app
    entrypoint: ["python", "-m", "cloudcart.relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      disable: true

  notification-worker:
    <<: *app
    entrypoint: ["python", "-m", "cloudcart.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      disable: true

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: cloudcart
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart -d cloudcart"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - database-data:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.75
    restart: unless-stopped

  broker:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - broker-data:/var/lib/rabbitmq
    mem_limit: 512m
    cpus: 0.75
    restart: unless-stopped

volumes:
  database-data:
  broker-data:
