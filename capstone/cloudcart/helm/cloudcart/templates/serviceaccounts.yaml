{{- range $component := list "api" "relay" "worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudcart.fullname" $ }}-{{ $component }}
  labels:
    {{- include "cloudcart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
