apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudcart.fullname" . }}-api
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "cloudcart.componentSelector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudcart.fullname" . }}-postgres
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "cloudcart.componentSelector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudcart.fullname" . }}-postgres-headless
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "cloudcart.componentSelector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudcart.fullname" . }}-rabbitmq
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  selector:
    {{- include "cloudcart.componentSelector" (dict "root" . "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
