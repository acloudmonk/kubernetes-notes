apiVersion: batch/v1
kind: Job
metadata:
  name: cloudcart-migrate
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: cloudcart-migrate
    app.kubernetes.io/part-of: cloudcart
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudcart-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cloudcart.migrate"]
          envFrom:
            - configMapRef: {name: cloudcart-config}
            - secretRef: {name: cloudcart-credentials}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
