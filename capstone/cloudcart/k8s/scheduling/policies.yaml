apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cloudcart-serving
value: 10000
globalDefault: false
preemptionPolicy: Never
description: "Non-preempting priority for CloudCart request-serving Pods."
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudcart-api
  namespace: cloudcart
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudcart-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudcart-relay
  namespace: cloudcart
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudcart-relay
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudcart-worker
  namespace: cloudcart
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudcart-worker
