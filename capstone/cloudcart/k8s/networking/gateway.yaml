apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cloudcart-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloudcart
  namespace: cloudcart
spec:
  gatewayClassName: cloudcart-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: cloudcart.local
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudcart
  namespace: cloudcart
spec:
  parentRefs:
    - name: cloudcart
      sectionName: http
  hostnames:
    - cloudcart.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cloudcart-api
          port: 8080
