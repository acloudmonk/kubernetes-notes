apiVersion: v1
kind: Service
metadata:
  name: cloudcart-api
  namespace: cloudcart
spec:
  selector:
    app.kubernetes.io/name: cloudcart-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-api
  namespace: cloudcart
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: cloudcart-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudcart-api
        app.kubernetes.io/part-of: cloudcart
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: cloudcart-config}
            - secretRef: {name: cloudcart-credentials}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-relay
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudcart-relay}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudcart-relay
        app.kubernetes.io/part-of: cloudcart
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: relay
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cloudcart.relay"]
          envFrom:
            - configMapRef: {name: cloudcart-config}
            - secretRef: {name: cloudcart-credentials}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-worker
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudcart-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudcart-worker
        app.kubernetes.io/part-of: cloudcart
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cloudcart.worker"]
          envFrom:
            - configMapRef: {name: cloudcart-config}
            - secretRef: {name: cloudcart-credentials}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
