apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: cloudcart
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: cloudcart
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.9-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: cloudcart
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: cloudcart-credentials
                  key: AMQP_PASSWORD
          ports:
            - name: amqp
              containerPort: 5672
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 750m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          emptyDir: {}
