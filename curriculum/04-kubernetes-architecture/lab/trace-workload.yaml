apiVersion: v1
kind: Namespace
metadata:
  name: architecture-lab
  labels:
    learning.cloudcart.io/module: "04"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-trace
  namespace: architecture-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reconciliation-trace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reconciliation-trace
    spec:
      nodeSelector:
        learning.cloudcart.io/role: worker
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
