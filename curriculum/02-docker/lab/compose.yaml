name: docker-module

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-module-api:1.0
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    mem_limit: 384m
    cpus: 0.75
    restart: unless-stopped

volumes:
  database-data:
