apiVersion: v1
kind: Pod
metadata:
  name: missing-secret-consumer
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: missing-secret-consumer
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: consumer
      image: cloudcart-app:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "import time; time.sleep(300)"]
      env:
        - name: REQUIRED_VALUE
          valueFrom:
            secretKeyRef:
              name: secret-that-does-not-exist
              key: required-value
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
