apiVersion: v1
kind: Namespace
metadata:
  name: security-lab
  labels:
    learning.cloudcart.io/admission: enforce
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-auditor
  namespace: security-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-metadata-reader
  namespace: security-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-auditor-reads-pods
  namespace: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-metadata-reader
subjects:
  - kind: ServiceAccount
    name: security-auditor
    namespace: security-lab
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-bounds
  namespace: security-lab
spec:
  limits:
    - type: Container
      min: {cpu: 5m, memory: 8Mi}
      max: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-budget
  namespace: security-lab
spec:
  hard:
    pods: "5"
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: "2"
    limits.memory: 1Gi
