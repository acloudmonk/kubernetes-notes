apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: cloudcart
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 32Mi}
      default: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudcart-capacity
  namespace: cloudcart
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    persistentvolumeclaims: "4"
