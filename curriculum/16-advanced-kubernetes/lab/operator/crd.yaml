apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudcartpolicies.learning.cloudcart.io
spec:
  group: learning.cloudcart.io
  scope: Namespaced
  names:
    plural: cloudcartpolicies
    singular: cloudcartpolicy
    kind: CloudCartPolicy
    shortNames: [ccp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: ConfigMap
          type: string
          jsonPath: .status.configMap
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 200
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
