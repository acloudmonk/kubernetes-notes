apiVersion: v1
kind: Namespace
metadata:
  name: mesh-lab
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mesh-server, namespace: mesh-lab}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mesh-client, namespace: mesh-lab}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mesh-other, namespace: mesh-lab}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mesh-server, namespace: mesh-lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: mesh-server}}
  template:
    metadata: {labels: {app: mesh-server}}
    spec:
      serviceAccountName: mesh-server
      containers:
        - name: server
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8080"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 2}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: mesh-server, namespace: mesh-lab}
spec:
  selector: {app: mesh-server}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mesh-client, namespace: mesh-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: mesh-client}}
  template:
    metadata: {labels: {app: mesh-client}}
    spec:
      serviceAccountName: mesh-client
      containers:
        - name: client
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(86400)"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mesh-other, namespace: mesh-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: mesh-other}}
  template:
    metadata: {labels: {app: mesh-other}}
    spec:
      serviceAccountName: mesh-other
      containers:
        - name: client
          image: cloudcart-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(86400)"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-server-client-only
  namespace: mesh-lab
spec:
  selector:
    matchLabels: {app: mesh-server}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/mesh-lab/sa/mesh-client"]
