apiVersion: v1
kind: Pod
metadata:
  name: memory-limit-probe
  namespace: cloudcart
  labels: {learning.cloudcart.io/fixture: scheduling}
spec:
  restartPolicy: Never
  containers:
    - name: allocator
      image: cloudcart-app:0.1.0
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "x = bytearray(128 * 1024 * 1024); print(len(x))"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
